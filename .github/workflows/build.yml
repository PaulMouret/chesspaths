name: Build ChessPaths

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        include:

          - os: windows-latest
            artifact_name: ChessPaths-Windows
            executable: ChessPaths.exe
            data_separator: ";"

          - os: ubuntu-latest
            artifact_name: ChessPaths-Linux
            executable: ChessPaths
            data_separator: ":"

          - os: macos-latest
            artifact_name: ChessPaths-macOS
            executable: ChessPaths
            data_separator: ":"

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --windowed \
            --name ChessPaths \
            --icon assets/app.ico \
            --add-data "assets/app.ico${{ matrix.data_separator }}assets" \
            --add-data "main_template.tex${{ matrix.data_separator }}." \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.executable }}
