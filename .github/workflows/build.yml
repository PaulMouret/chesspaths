name: Build ChessPaths

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    strategy:

      fail-fast: false

      matrix:

        include:

          - os: windows-latest
            icon: assets/app.ico

          - os: macos-latest
            icon: assets/app.icns


    runs-on: ${{ matrix.os }}


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install dependencies

        shell: bash

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pyinstaller


      # --------------------------------------------------------
      # Build Windows
      # --------------------------------------------------------

      - name: Build Windows executable

        if: matrix.os == 'windows-latest'

        shell: bash

        run: |

          pyinstaller \
            --clean \
            --onefile \
            --windowed \
            --name ChessPaths \
            --icon "${{ matrix.icon }}" \
            --add-data "assets/app.ico;assets" \
            --add-data "main_template.tex;." \
            main.py

      - name: Rename Windows executable

        if: matrix.os == 'windows-latest'

        shell: bash

        run: |

          mv \
            dist/ChessPaths.exe \
            dist/ChessPaths-${{ github.ref_name }}-Windows.exe


      # --------------------------------------------------------
      # Build macOS application
      # --------------------------------------------------------

      - name: Build macOS application

        if: matrix.os == 'macos-latest'

        shell: bash

        run: |

          pyinstaller \
            --clean \
            --windowed \
            --name ChessPaths \
            --icon "${{ matrix.icon }}" \
            --add-data "assets/app.icns:assets" \
            --add-data "main_template.tex:." \
            main.py


      # --------------------------------------------------------
      # Package macOS app
      # --------------------------------------------------------

      - name: Compress macOS application

        if: matrix.os == 'macos-latest'

        shell: bash

        run: |

          cd dist

          zip -r \
            ChessPaths-${{ github.ref_name }}-macOS.zip \
            ChessPaths.app


      # --------------------------------------------------------
      # Upload artifacts
      # --------------------------------------------------------

      - name: Upload Windows executable

        if: matrix.os == 'windows-latest'

        uses: softprops/action-gh-release@v2

        with:

          files: dist/ChessPaths-${{ github.ref_name }}-Windows.exe


      - name: Upload macOS application

        if: matrix.os == 'macos-latest'

        uses: softprops/action-gh-release@v2

        with:

          files: dist/ChessPaths-${{ github.ref_name }}-macOS.zip
