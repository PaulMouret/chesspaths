name: Build ChessPaths

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    strategy:

      fail-fast: false

      matrix:

        include:

          - os: windows-latest
            artifact_name: ChessPaths-Windows
            icon: assets/app.ico

          - os: ubuntu-latest
            artifact_name: ChessPaths-Linux
            icon: assets/app.png

          - os: macos-latest
            artifact_name: ChessPaths-macOS
            icon: assets/app.icns


    runs-on: ${{ matrix.os }}


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install dependencies

        shell: bash

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pyinstaller


      # --------------------------------------------------------
      # Build Windows
      # --------------------------------------------------------

      - name: Build Windows executable

        if: matrix.os == 'windows-latest'

        shell: bash

        run: |

          pyinstaller \
            --clean \
            --onefile \
            --windowed \
            --name ChessPaths \
            --icon "${{ matrix.icon }}" \
            --add-data "assets/app.ico;assets" \
            --add-data "main_template.tex;." \
            main.py


      # --------------------------------------------------------
      # Build Linux
      # --------------------------------------------------------

      - name: Build Linux executable

        if: matrix.os == 'ubuntu-latest'

        shell: bash

        run: |

          pyinstaller \
            --clean \
            --onefile \
            --windowed \
            --name ChessPaths \
            --icon "${{ matrix.icon }}" \
            --add-data "assets/app.png:assets" \
            --add-data "main_template.tex:." \
            main.py


      # --------------------------------------------------------
      # Build macOS application
      # --------------------------------------------------------

      - name: Build macOS application

        if: matrix.os == 'macos-latest'

        shell: bash

        run: |

          pyinstaller \
            --clean \
            --windowed \
            --name ChessPaths \
            --icon "${{ matrix.icon }}" \
            --add-data "assets/app.icns:assets" \
            --add-data "main_template.tex:." \
            main.py


      # --------------------------------------------------------
      # Package macOS app
      # --------------------------------------------------------

      - name: Compress macOS application

        if: matrix.os == 'macos-latest'

        shell: bash

        run: |

          cd dist

          zip -r ChessPaths-macOS.zip ChessPaths.app



      # --------------------------------------------------------
      # Upload artifacts
      # --------------------------------------------------------

      - name: Upload Windows artifact

        if: matrix.os == 'windows-latest'

        uses: actions/upload-artifact@v4

        with:

          name: ${{ matrix.artifact_name }}

          path: dist/ChessPaths.exe



      - name: Upload Linux artifact

        if: matrix.os == 'ubuntu-latest'

        uses: actions/upload-artifact@v4

        with:

          name: ${{ matrix.artifact_name }}

          path: dist/ChessPaths



      - name: Upload macOS artifact

        if: matrix.os == 'macos-latest'

        uses: actions/upload-artifact@v4

        with:

          name: ${{ matrix.artifact_name }}

          path: dist/ChessPaths-macOS.zip